  <script>
    const DOCUMENTS = {"overview":{"title":"后端设计资料入口","path":"06-技术与开发/后端设计/README.md"},"architecture":{"title":"总体架构","path":"06-技术与开发/后端设计/01-总体架构.md"},"api-guide":{"title":"API 通用规范","path":"06-技术与开发/后端设计/02-API通用规范.md"},"database":{"title":"数据库设计","path":"06-技术与开发/后端设计/03-数据库设计.md"},"api-catalog":{"title":"模块 API 清单","path":"06-技术与开发/后端设计/04-模块API清单.md"},"files-jobs":{"title":"文件与异步任务","path":"06-技术与开发/后端设计/05-文件与异步任务.md"},"roadmap":{"title":"后端开发实施路线","path":"06-技术与开发/后端设计/06-后端开发实施路线.md"},"specification":{"title":"Node 后端架构与 API / 数据设计规格","path":"06-技术与开发/后端设计/2026-09-08-Node后端架构与API数据设计规格.md"},"delivery-plan":{"title":"后端资料与公开页面实施计划","path":"06-技术与开发/后端设计/2026-09-08-后端资料与公开页面实施计划.md"}};
    const esc = (text) => String(text).replace(/[&<>"']/g, (char) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[char]);
    const inline = (text) => esc(text).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/\[([^\]]+)\]\(([^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
    function renderMarkdown(markdown) {
      const lines = markdown.replace(/\r\n/g, '\n').split('\n'); let html = ''; let paragraph = []; let list = null; let table = [];
      const flushParagraph = () => { if (paragraph.length) { html += '<p>' + inline(paragraph.join(' ')) + '</p>'; paragraph = []; } };
      const flushList = () => { if (list) { html += '<' + list.type + '>' + list.items.map((item) => '<li>' + inline(item) + '</li>').join('') + '</' + list.type + '>'; list = null; } };
      const flushTable = () => { if (table.length > 1) { const rows = table.filter((row, index) => index !== 1).map((row, index) => '<tr>' + row.split('|').slice(1, -1).map((cell) => '<' + (index ? 'td' : 'th') + '>' + inline(cell.trim()) + '</' + (index ? 'td' : 'th') + '>').join('') + '</tr>').join(''); html += '<div class="table-wrap"><table>' + rows + '</table></div>'; } table = []; };
      for (let index = 0; index < lines.length; index += 1) { const line = lines[index]; if (line.startsWith('```')) { flushParagraph(); flushList(); flushTable(); const code = []; index += 1; while (index < lines.length && !lines[index].startsWith('```')) code.push(lines[index++]); html += '<pre><code>' + esc(code.join('\n')) + '</code></pre>'; continue; } if (line.startsWith('|')) { flushParagraph(); flushList(); table.push(line); continue; } flushTable(); const heading = line.match(/^(#{1,4})\s+(.+)$/); const item = line.match(/^\s*([-*+] |\d+\. )(.+)$/); if (heading) { flushParagraph(); flushList(); const level = heading[1].length; html += '<h' + level + '>' + inline(heading[2]) + '</h' + level + '>'; } else if (item) { flushParagraph(); const type = /^\d+\./.test(item[1]) ? 'ol' : 'ul'; if (!list || list.type !== type) { flushList(); list = { type, items: [] }; } list.items.push(item[2]); } else if (!line.trim()) { flushParagraph(); flushList(); } else if (line.startsWith('> ')) { flushParagraph(); flushList(); html += '<blockquote><p>' + inline(line.slice(2)) + '</p></blockquote>'; } else if (/^---+$/.test(line.trim())) { flushParagraph(); flushList(); html += '<hr>'; } else { paragraph.push(line.trim()); } }
      flushParagraph(); flushList(); flushTable(); return html;
    }
    const params = new URLSearchParams(location.search); const selectedId = DOCUMENTS[params.get('doc')] ? params.get('doc') : 'overview'; const documentInfo = DOCUMENTS[selectedId]; const select = document.querySelector('[data-document-select]'); const content = document.querySelector('[data-document-content]');
    select.innerHTML = Object.entries(DOCUMENTS).map(([id, info]) => '<option value="' + id + '">' + esc(info.title) + '</option>').join(''); select.value = selectedId; select.addEventListener('change', () => { location.search = '?doc=' + encodeURIComponent(select.value); });
    fetch(documentInfo.path).then((response) => { if (!response.ok) throw new Error(String(response.status)); return response.text(); }).then((markdown) => { document.title = documentInfo.title + ' · 独家童话'; content.innerHTML = renderMarkdown(markdown); }).catch(() => { content.innerHTML = '<p class="error">文档暂时无法加载，请稍后重试。</p>'; });
  </script>
